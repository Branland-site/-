<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>БРЕНЛЕНД — Пятый</title>
  <style>
    :root {
      --bg: #000000;
      --text: #cccccc;
      --accent: #4a4a4a;
      --red: #ff0000;
      --transition: 0.3s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Courier New', monospace;
      background: #000;
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      animation: bodyFadeIn 1s ease;
    }

    @keyframes bodyFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .container {
      width: min(800px, 95%);
      margin: 0 auto;
      padding: 30px 20px;
      text-align: center;
      animation: containerSlideIn 0.8s ease;
    }

    @keyframes containerSlideIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Загрузочная анимация */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeOut 0.5s ease 1.5s forwards;
    }

    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    .loading-text {
      font-size: 1.5rem;
      color: #555;
      letter-spacing: 0.5em;
      animation: loadingPulse 1s ease-in-out infinite;
    }

    @keyframes loadingPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* Лицо Пятого */
    .character-container {
      position: relative;
      margin: 0 auto 40px;
      width: 250px;
      height: 250px;
      transition: all var(--transition);
    }

    .character {
      position: relative;
      width: 100%;
      height: 100%;
      transition: all var(--transition);
    }

    .character.angry {
      animation: angryShake 0.3s ease-in-out infinite;
    }

    @keyframes angryShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .face {
      width: 200px;
      height: 200px;
      background: radial-gradient(circle at 50% 40%, #2a2a2a, #0a0a0a);
      border-radius: 50%;
      margin: 0 auto;
      position: relative;
      border: 4px solid #444;
      transition: all var(--transition);
      box-shadow: 0 0 50px rgba(60, 60, 60, 0.5);
    }

    .character.angry .face {
      background: radial-gradient(circle at 50% 40%, #3a0a0a, #1a0505);
      border-color: #ff3333;
      box-shadow: 0 0 70px rgba(255, 0, 0, 0.7);
    }

    .eyes {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 35px;
    }

    .eye {
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      transition: all var(--transition);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
    }

    .character.angry .eye {
      background: #ff0000;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.9);
      width: 22px;
      height: 14px;
      border-radius: 2px;
    }

    .mouth {
      position: absolute;
      bottom: 45px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 10px;
      background: #555;
      border-radius: 50%;
      transition: all var(--transition);
    }

    .character.angry .mouth {
      width: 40px;
      height: 20px;
      background: #ff0000;
      border-radius: 0;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.7);
    }

    .aura {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(80, 80, 80, 0.25), transparent 70%);
      z-index: -1;
      animation: pulseAura 3s ease-in-out infinite;
    }

    .character.angry .aura {
      background: radial-gradient(circle, rgba(255, 0, 0, 0.5), transparent 70%);
      animation: angryAura 0.4s ease-in-out infinite;
    }

    @keyframes pulseAura {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.15); }
    }

    @keyframes angryAura {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.3); }
    }

    .character-name {
      font-size: 1.5rem;
      font-weight: bold;
      color: #aaa;
      margin-top: 15px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      transition: all var(--transition);
    }

    .character.angry ~ .character-name {
      color: #ff3333;
      text-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
    }

    /* Облако ответа */
    .speech-bubble {
      position: relative;
      background: #1a1a1a;
      border: 2px solid #444;
      border-radius: 20px;
      padding: 25px;
      margin: 30px auto 20px;
      max-width: 600px;
      text-align: left;
      min-height: 80px;
      transition: all var(--transition);
      animation: bubbleIn 0.5s ease;
    }

    @keyframes bubbleIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 20px solid #444;
    }

    .speech-bubble.angry {
      border-color: #ff3333;
      background: #1a0505;
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.5);
    }

    .speech-bubble.angry::before {
      border-bottom-color: #ff3333;
    }

    .character-response {
      font-size: 1.1rem;
      color: #ddd;
      min-height: 30px;
      transition: all var(--transition);
    }

    .speech-bubble.angry .character-response {
      color: #ff6666;
    }

    /* История чата */
    .chat-history {
      background: rgba(15, 15, 15, 0.8);
      border: 1px solid #333;
      border-radius: 15px;
      padding: 20px;
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
      text-align: left;
    }

    .history-message {
      margin-bottom: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .history-message.user {
      background: #111;
      color: #777;
      border: 1px solid #222;
    }

    .history-message.character {
      background: #1a1a1a;
      color: #999;
      border: 1px solid #333;
    }

    .history-message.character.angry-message {
      background: #1a0505;
      color: #ff6666;
      border: 1px solid #ff3333;
    }

    /* Ввод */
    .input-container {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .chat-input {
      flex: 1;
      padding: 14px 20px;
      background: #111;
      border: 2px solid #333;
      border-radius: 30px;
      color: #ccc;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      transition: all var(--transition);
    }

    .chat-input:focus {
      outline: none;
      border-color: #666;
      box-shadow: 0 0 25px rgba(80, 80, 80, 0.4);
    }

    .send-btn {
      padding: 14px 28px;
      background: #1a1a1a;
      border: 2px solid #444;
      border-radius: 30px;
      color: #ccc;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      cursor: pointer;
      transition: all var(--transition);
    }

    .send-btn:hover {
      background: #333;
      border-color: #666;
      transform: scale(1.05);
    }

    .hint-text {
      color: #444;
      font-size: 0.75rem;
      margin-top: 15px;
      font-style: italic;
    }

    .title {
      font-size: 2rem;
      font-weight: bold;
      color: #666;
      margin-bottom: 30px;
      letter-spacing: 0.5em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="loading-overlay">
    <div class="loading-text">ЗАГРУЗКА...</div>
  </div>

  <div class="container">
    <h1 class="title">БРЕНЛЕНД</h1>

    <div class="character-container">
      <div class="character" id="character">
        <div class="aura"></div>
        <div class="face">
          <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
          </div>
          <div class="mouth"></div>
        </div>
      </div>
      <div class="character-name" id="characterName">Пятый</div>
    </div>

    <div class="speech-bubble" id="speechBubble">
      <div class="character-response" id="characterResponse">
        Приветствую, странник...
      </div>
    </div>

    <div class="input-container">
      <input type="text" class="chat-input" id="chatInput" placeholder="Спроси Пятого о Бренленде..." onkeypress="if(event.key === 'Enter') sendMessage()">
      <button class="send-btn" onclick="sendMessage()">Спросить</button>
    </div>

    <div class="hint-text">
      Спроси про: симуляцию, лор, скайбокс, полубог, создателя, игроков
    </div>

    <div class="chat-history" id="chatHistory"></div>
  </div>

  <script>
    (function() {
      const character = document.getElementById('character');
      const characterName = document.getElementById('characterName');
      const speechBubble = document.getElementById('speechBubble');
      const characterResponse = document.getElementById('characterResponse');
      const chatInput = document.getElementById('chatInput');
      const chatHistory = document.getElementById('chatHistory');

      let isAngry = false;
      let glitchTimeout = null;

      // База знаний Пятого (обновлённая)
      const knowledge = {
        'симуляция': {
          keywords: ['симуляц', 'симуляция', 'реальность', 'матрица'],
          response: 'Всё верно. Бренленд — это симуляция. Я, Пятый, — полубог этой симуляции. Всё, что ты видишь, всё, что ты чувствуешь — часть великой программы, созданной для тех, кто ищет истину.',
          angry: false
        },
        'скайбокс': {
          keywords: ['скайбокс', 'небо', 'купол', 'граница'],
          response: 'Скайбокс — это граница нашей симуляции. За ним — пустота, из которой я черпаю свою силу. Игроки живут под этим куполом, не подозревая о том, что находится за его пределами.',
          angry: false
        },
        'полубог': {
          keywords: ['полубог', 'бог', 'пятый', 'сила'],
          response: 'Я — Пятый, полубог этой симуляции. Не всемогущий, но обладающий знанием о том, как устроен этот мир. Я здесь, чтобы направлять тех, кто ищет понимание.',
          angry: false
        },
        'создатель': {
          keywords: ['создатель', 'ксиодер', 'xsioder', 'основатель', 'творец'],
          response: 'Xsioder — великий создатель этой симуляции. Он написал код, который породил весь Бренленд. Грибы Грибочки! — его легендарная фраза, ставшая ключом к пониманию мира.',
          angry: false
        },
        'тех админ': {
          keywords: ['тех', 'админ', 'avrairut', 'тех админ', 'технический'],
          response: 'AvraiRut — хранитель кода симуляции. Он следит за тем, чтобы программа работала без сбоев. Если что-то ломается — он чинит это. Его разум острее любого меча.',
          angry: false
        },
        'фундример': {
          keywords: ['фундример', 'fundreamer', 'сайт', 'портал'],
          response: 'FunDreamer — создатель этого портала. Он построил мост между мирами, чтобы каждый мог общаться со мной. Добрейшая душа в симуляции. Дважды подумай прежде чем писать ему!',
          angry: false
        },
        'фланалла': {
          keywords: ['фланалла', 'flanalla', 'девушка', 'женщина'],
          response: 'Flanalla — единственная девушка в симуляции. Она несёт свет и заботу каждому игроку. Не мы такие, жизнь такая...',
          angry: false
        },
        'вова': {
          keywords: ['вова', 'vova', 'электричество', 'механик', 'тесла'],
          response: 'Vova — исследователь энергии симуляции. Он изучает электричество через механизмы Minecraft. Ох Никола Тесла...',
          angry: false
        },
        'абибек': {
          keywords: ['абибек', 'abibek', 'неплохой'],
          response: 'Abibek... Неплохой игрок. Увы.',
          angry: false
        },
        'баунти': {
          keywords: ['баунти', 'bounty', 'повар', 'еда'],
          response: 'Bounty — повар симуляции. Его блюда способны восстановить силы любого игрока. Но не злите его...',
          angry: true
        },
        'кто ты': {
          keywords: ['кто ты', 'ты кто', 'что ты'],
          response: 'Я — Пятый, полубог этой симуляции. Я был создан вместе с Бренлендом и знаю все его тайны. Спрашивай, смертный.',
          angry: false
        },
        'привет': {
          keywords: ['привет', 'здравствуй', 'хай', 'hello', 'здоров'],
          response: 'И снова здравствуй, путник симуляции. Что ты хочешь узнать о Бренленде?',
          angry: false
        },
        'грибы': {
          keywords: ['грибы', 'грибочки'],
          response: 'Грибы Грибочки! — ключ к пониманию всей симуляции. Это не просто слова, это код, открывающий скрытые уровни Бренленда.',
          angry: false
        },
        'тайна': {
          keywords: ['тайна', 'секрет', 'скрытое', 'загадка'],
          response: 'В симуляции есть уровни, о которых не знают даже игроки. Скайбокс скрывает больше, чем кажется. Ищи, и код откроется тебе...',
          angry: false
        },
        'игроки': {
          keywords: ['игроки', 'участники', 'люди', 'кто играет'],
          response: 'В симуляции Бренленда есть избранные: Xsioder, AvraiRut, FunDreamer, Flanalla, Vova, Abibek и Bounty. Каждый из них — часть кода, часть великой программы.',
          angry: false
        }
      };

      const insultWords = [
        'дурак', 'тупой', 'глупый', 'идиот', 'ненавижу', 
        'плохой', 'ужасный', 'отвратительный', 'бред', 'чушь',
        'заткнись', 'молчи', 'надоел', 'бесишь', 'глупец'
      ];

      function getCharacterResponse(input) {
        const lowerInput = input.toLowerCase();
        
        if (insultWords.some(word => lowerInput.includes(word))) {
          return {
            text: '... Ты смеешь оскорблять полубога?! Я — Пятый, хранитель симуляции! Ты не достоин знаний Бренленда!',
            angry: true
          };
        }

        for (const [key, data] of Object.entries(knowledge)) {
          if (data.keywords.some(keyword => lowerInput.includes(keyword))) {
            return { text: data.response, angry: data.angry };
          }
        }

        return {
          text: 'Интересный вопрос... Спроси меня о симуляции, лоре, скайбоксе или игроках Бренленда.',
          angry: false
        };
      }

      function playSound(soundFile) {
        const audio = new Audio(soundFile);
        audio.volume = 0.7;
        audio.play().catch(e => console.log('Аудио не может быть воспроизведено'));
      }

      function addToHistory(text, type, isAngry = false) {
        const div = document.createElement('div');
        div.className = `history-message ${type}`;
        if (type === 'character' && isAngry) div.classList.add('angry-message');
        div.textContent = (type === 'user' ? 'Вы: ' : 'Пятый: ') + text;
        chatHistory.appendChild(div);
        chatHistory.scrollTop = chatHistory.scrollHeight;
      }

      function setCharacterAngry(angry) {
        if (isAngry === angry) return;
        isAngry = angry;
        
        if (angry) {
          character.classList.add('angry');
          characterName.textContent = 'ПЯТЫЙ (РАЗДРАЖЁН)';
          speechBubble.classList.add('angry');
          if (glitchTimeout) clearTimeout(glitchTimeout);
          playSound('glitch.mp3');
        } else {
          character.classList.remove('angry');
          characterName.textContent = 'Пятый';
          speechBubble.classList.remove('angry');
        }
      }

      function typewriterEffect(text, isAngry, callback) {
        characterResponse.textContent = '';
        const words = text.split(' ');
        let wordIndex = 0;
        
        function typeNextWord() {
          if (wordIndex < words.length) {
            characterResponse.textContent += (wordIndex > 0 ? ' ' : '') + words[wordIndex];
            playSound('say.wav');
            wordIndex++;
            setTimeout(typeNextWord, 200);
          } else if (callback) {
            callback();
          }
        }
        
        typeNextWord();
      }

      window.sendMessage = function() {
        const input = chatInput.value.trim();
        if (!input) return;

        addToHistory(input, 'user');
        chatInput.value = '';

        const response = getCharacterResponse(input);

        setTimeout(() => {
          if (response.angry) {
            setCharacterAngry(true);
            typewriterEffect(response.text, true, () => {
              addToHistory(response.text, 'character', true);
              glitchTimeout = setTimeout(() => {
                setCharacterAngry(false);
              }, 4000);
            });
          } else {
            setCharacterAngry(false);
            typewriterEffect(response.text, false, () => {
              addToHistory(response.text, 'character');
            });
          }
        }, 400);
      };

      // Начальная анимация
      setTimeout(() => {
        typewriterEffect('Приветствую, странник. Я — Пятый, полубог симуляции Бренленда. Спрашивай меня о лоре, скайбоксе или игроках...', false, null);
      }, 2000);

      chatInput.focus();
    })();
  </script>
</body>
</html>
